<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guild Wars Navigator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { display: block; width: 100%; height: 100%; }
    #loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
               color: #aaa; font: 16px sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="visualizer"></canvas>
  <div id="loading">Loading…</div>
  <script type="module">
    import init from "./pkg/gw-nav.js";
    init().then(() => document.getElementById("loading").remove())
          .catch((e) => { document.getElementById("loading").textContent = "Failed to start: " + e; });
  </script>
</body>
</html>
